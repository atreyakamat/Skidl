<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Hotspot Skribble — Draw, guess, and laugh with friends over Wi-Fi hotspot.">
  <title>Hotspot Skribble — Web Client</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ─── Connection Screen ─── -->
    <div id="screen-connect" class="screen active">
      <div class="logo-section">
        <div class="logo-emoji">🎨</div>
        <h1>Hotspot Skribble</h1>
        <p class="subtitle">Draw, guess &amp; laugh with friends</p>
      </div>
      <div class="card">
        <div class="input-group">
          <label for="hostUrl">Host Address</label>
          <input id="hostUrl" type="text" placeholder="ws://192.168.43.1:50000" autocomplete="off" spellcheck="false">
        </div>
        <div class="input-group">
          <label for="playerName">Your Name</label>
          <input id="playerName" type="text" placeholder="Player" maxlength="20" autocomplete="off">
        </div>
        <button id="connectBtn" class="btn btn-primary btn-lg">📡 Connect</button>
        <p id="status" class="status-text">Not connected</p>
      </div>
    </div>

    <!-- ─── Lobby Screen ─── -->
    <div id="screen-lobby" class="screen">
      <div class="header">
        <h2 id="roomTitle">Lobby</h2>
        <button id="disconnectBtn" class="btn btn-sm btn-outline">Disconnect</button>
      </div>
      <div class="card">
        <h3>👥 Players</h3>
        <ul id="players" class="player-list"></ul>
      </div>
      <button id="readyBtn" class="btn btn-secondary btn-lg">✅ Toggle Ready</button>
    </div>

    <!-- ─── Game Screen ─── -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="game-info">
          <span id="drawerLabel" class="drawer-label">✏️ Drawing: —</span>
          <span id="roundLabel" class="round-label">Round 1/3</span>
        </div>
        <div id="timerDisplay" class="timer">⏱ 90s</div>
      </div>

      <div id="secretWordBanner" class="secret-word-banner hidden">
        <span id="secretWord"></span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <!-- Drawing tools (shown only to drawer) -->
      <div id="drawingTools" class="drawing-tools hidden">
        <div class="color-palette" id="colorPalette"></div>
        <div class="thickness-control">
          <label for="thicknessSlider">Thickness</label>
          <input id="thicknessSlider" type="range" min="2" max="40" value="12">
          <span id="thicknessValue">12px</span>
        </div>
        <div class="tool-buttons">
          <button id="undoBtn" class="btn btn-sm btn-outline">↩ Undo</button>
          <button id="clearBtn" class="btn btn-sm btn-outline">🗑 Clear</button>
        </div>
      </div>

      <!-- Guess section (shown only to guesser) -->
      <div id="guessSection" class="guess-section">
        <div id="messages" class="messages-container"></div>
        <div class="guess-input-row">
          <input id="guessInput" type="text" placeholder="Type your guess…" autocomplete="off" maxlength="50">
          <button id="guessBtn" class="btn btn-primary">➡️</button>
        </div>
      </div>

      <!-- Scoreboard -->
      <div id="scoreboard" class="scoreboard"></div>
    </div>

    <!-- ─── Scores Screen ─── -->
    <div id="screen-scores" class="screen">
      <h2 id="scoresTitle">📊 Round Scores</h2>
      <div id="revealedWord" class="revealed-word hidden"></div>
      <div id="finalScores" class="final-scores"></div>
      <p class="scores-footer">Waiting for host to continue…</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
